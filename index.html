<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="מלאי קפואים">
<meta name="theme-color" content="#0d4f68">
<title>מלאי הקפואים שלי</title>
<style>
  :root{
    --main:#0d4f68;
    --main-dark:#082f3d;
    --accent:#2fb6da;
    --cream:#eef6f8;
    --card:#ffffff;
    --text:#16232b;
    --muted:#6c8590;
    --border:#d8e8ee;
    --danger:#c0392b;
    --status-good:#0ca30c;
    --status-warning:#c98500;
    --status-serious:#c1552c;
    --status-critical:#c0392b;
    --c0:#2a78d6; --c0-text:#fff;
    --c1:#eb6834; --c1-text:#fff;
    --c2:#1baf7a; --c2-text:#fff;
    --c3:#eda100; --c3-text:#3d2e00;
    --c4:#e87ba4; --c4-text:#5b1220;
    --c5:#008300; --c5-text:#fff;
    --c6:#4a3aa7; --c6-text:#fff;
    --c7:#c0392b; --c7-text:#fff;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--cream); color:var(--text);
    padding-bottom:env(safe-area-inset-bottom);
  }
  #app{display:flex; flex-direction:column; min-height:100vh;}
  header.top{
    background:linear-gradient(135deg,var(--main),var(--main-dark));
    color:#fff; padding:calc(env(safe-area-inset-top) + 14px) 16px 14px;
    position:sticky; top:0; z-index:20;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
  }
  header.top h1{margin:0 0 10px; font-size:20px; display:flex; align-items:center; gap:8px;}
  .search-row{display:flex; gap:8px;}
  .search-row input{
    flex:1; border:none; border-radius:12px; padding:10px 12px; font-size:15px;
    background:rgba(255,255,255,.92); color:var(--text);
  }
  .icon-btn{
    background:rgba(255,255,255,.18); border:none; color:#fff; border-radius:12px;
    width:40px; height:40px; font-size:18px; display:flex; align-items:center; justify-content:center;
    flex:none;
  }
  .chips{display:flex; gap:8px; overflow-x:auto; padding:10px 16px 0; -webkit-overflow-scrolling:touch;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{
    flex:none; padding:6px 14px; border-radius:999px; background:rgba(255,255,255,.15);
    color:#fff; font-size:13px; border:1px solid rgba(255,255,255,.3);
  }
  .chip.active{background:#fff; color:var(--main-dark); font-weight:600; border-color:#fff;}

  main{flex:1; padding:14px 16px 90px; overflow-y:auto;}
  .hidden{display:none !important;}

  .sort-bar{display:flex; gap:8px; align-items:center; margin-bottom:12px;}
  .sort-bar select{
    flex:1; padding:8px 10px; border:1px solid var(--border); border-radius:10px; background:#fff; font-size:13px;
  }
  .sort-bar button{
    flex:none; width:40px; height:36px; border:1px solid var(--border); border-radius:10px; background:#fff; font-size:16px;
  }

  .empty-state{
    text-align:center; margin-top:60px; color:var(--muted);
  }
  .empty-state .big{font-size:44px; margin-bottom:10px;}
  .empty-state button{margin-top:16px;}

  .summary-bar{
    display:flex; gap:10px; margin-bottom:14px;
  }
  .summary-card{
    flex:1; background:var(--card); border-radius:14px; padding:10px 12px;
    text-align:center; box-shadow:0 1px 4px rgba(0,0,0,.06);
  }
  .summary-card .num{font-size:20px; font-weight:700; color:var(--main);}
  .summary-card .lbl{font-size:11px; color:var(--muted);}
  .summary-card.warn .num{color:var(--status-warning);}
  .summary-card.crit .num{color:var(--status-critical);}

  .card{
    background:var(--card); border-radius:16px; padding:12px 14px; margin-bottom:10px;
    box-shadow:0 1px 5px rgba(0,0,0,.07); position:relative;
  }
  .card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .card-title{font-size:16px; font-weight:700; margin:0;}
  .card-sub{font-size:13px; color:var(--muted); margin-top:2px;}
  .badge{
    font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px; white-space:nowrap;
  }
  .badge.c0{background:var(--c0); color:var(--c0-text);}
  .badge.c1{background:var(--c1); color:var(--c1-text);}
  .badge.c2{background:var(--c2); color:var(--c2-text);}
  .badge.c3{background:var(--c3); color:var(--c3-text);}
  .badge.c4{background:var(--c4); color:var(--c4-text);}
  .badge.c5{background:var(--c5); color:var(--c5-text);}
  .badge.c6{background:var(--c6); color:var(--c6-text);}
  .badge.c7{background:var(--c7); color:var(--c7-text);}

  .card-meta{
    display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:8px; font-size:12.5px; color:#3f5a64;
  }
  .card-meta span b{color:var(--text);}
  .card-actions{display:flex; gap:8px; margin-top:10px;}
  .card-actions button{
    flex:1; border:1px solid var(--border); background:#f5fbfc; border-radius:10px; padding:7px; font-size:13px;
  }
  .card-actions .qty-btn{flex:none; width:36px; font-weight:700; font-size:16px;}
  .status-ribbon{
    position:absolute; top:12px; left:14px; color:#fff; font-size:10.5px;
    padding:2px 8px; border-radius:999px;
  }
  .status-ribbon.warning{background:var(--status-warning);}
  .status-ribbon.serious{background:var(--status-serious);}
  .status-ribbon.critical{background:var(--status-critical);}

  .fab{
    position:fixed; left:20px; bottom:calc(78px + env(safe-area-inset-bottom));
    width:56px; height:56px; border-radius:50%; background:var(--accent); color:#06313f;
    font-size:28px; border:none; box-shadow:0 4px 12px rgba(0,0,0,.25); z-index:25;
  }

  nav.tabbar{
    position:fixed; bottom:0; right:0; left:0; background:#fff; border-top:1px solid var(--border);
    display:flex; padding-bottom:env(safe-area-inset-bottom); z-index:20;
  }
  nav.tabbar button{
    flex:1; background:none; border:none; padding:10px 0 8px; font-size:11px; color:var(--muted);
    display:flex; flex-direction:column; align-items:center; gap:2px;
  }
  nav.tabbar button .ic{font-size:20px;}
  nav.tabbar button.active{color:var(--main); font-weight:700;}

  .section-title{font-size:14px; font-weight:700; color:var(--main-dark); margin:16px 0 8px;}
  .bar-row{display:flex; align-items:center; gap:8px; margin-bottom:8px; font-size:13px;}
  .bar-row .lbl{width:78px; flex:none; color:var(--muted); text-align:left; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .bar-track{flex:1; background:#e2eef2; border-radius:6px; height:14px; overflow:hidden;}
  .bar-fill{height:100%; background:var(--main); border-radius:6px;}
  .bar-row .val{width:34px; flex:none; text-align:right; font-weight:600;}

  .loc-group{background:var(--card); border-radius:14px; padding:10px 14px; margin-bottom:10px; box-shadow:0 1px 4px rgba(0,0,0,.06);}
  .loc-group h4{margin:0 0 6px; font-size:14px; color:var(--main);}
  .loc-item{display:flex; justify-content:space-between; font-size:13px; padding:4px 0; border-top:1px dashed var(--border);}
  .loc-item:first-of-type{border-top:none;}

  .modal{
    position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:50; display:flex; align-items:flex-end;
  }
  .modal .sheet{
    background:#fff; width:100%; max-height:88vh; overflow-y:auto; border-radius:18px 18px 0 0;
    padding:16px 18px calc(20px + env(safe-area-inset-bottom));
  }
  .modal h2{margin:0 0 14px; font-size:18px; color:var(--main-dark);}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:12.5px; color:var(--muted); margin-bottom:4px;}
  .field input, .field select{
    width:100%; padding:9px 10px; border:1px solid var(--border); border-radius:10px; font-size:15px; background:#fbfdfe;
  }
  .row2{display:flex; gap:10px;}
  .row2 .field{flex:1;}
  .modal-actions{display:flex; gap:10px; margin-top:16px;}
  .btn{
    flex:1; padding:11px; border-radius:12px; border:none; font-size:15px; font-weight:600;
  }
  .btn.primary{background:var(--main); color:#fff;}
  .btn.secondary{background:#e2eef2; color:var(--main-dark);}
  .btn.danger{background:var(--danger); color:#fff;}
  .btn.full{width:100%;}

  .menu-list{padding:0;}
  .menu-list button{
    width:100%; text-align:right; padding:13px 6px; border:none; background:none; font-size:15.5px;
    border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center;
  }
  .menu-list button:last-child{border-bottom:none;}

  .import-map-row{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .import-map-row .lbl{width:100px; flex:none; font-size:13px; font-weight:600;}
  .import-map-row select{flex:1;}
  .import-mode{display:flex; gap:10px; margin:14px 0;}
  .import-mode label{
    flex:1; border:1px solid var(--border); border-radius:10px; padding:10px; text-align:center; font-size:13px;
  }
  .toast{
    position:fixed; bottom:100px; right:50%; transform:translateX(50%); background:#16232b; color:#fff;
    padding:10px 18px; border-radius:999px; font-size:13.5px; z-index:60; opacity:0; transition:opacity .25s;
    max-width:88vw; text-align:center; pointer-events:none;
  }
  .toast.show{opacity:1;}
  small.hint{color:var(--muted); display:block; margin-top:2px;}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <h1>🧊 מלאי הקפואים שלי</h1>
    <div class="search-row">
      <input id="search" type="search" placeholder="חיפוש: שם, קטגוריה, מקרר...">
      <button class="icon-btn" id="menu-btn">☰</button>
    </div>
    <div class="chips" id="category-chips"></div>
    <div class="chips" id="location-chips"></div>
  </header>

  <main id="view-inventory">
    <div class="summary-bar" id="summary-bar"></div>
    <div class="sort-bar">
      <select id="sort-field">
        <option value="category" selected>מיון: קטגוריה</option>
        <option value="name">מיון: שם</option>
        <option value="location">מיון: מקרר</option>
        <option value="shelf">מיון: מדף</option>
        <option value="expiryDate">מיון: תאריך תפוגה</option>
        <option value="entryDate">מיון: תאריך כניסה</option>
        <option value="packages">מיון: אריזות</option>
        <option value="quantity">מיון: כמות</option>
      </select>
      <button id="sort-dir" title="הפוך כיוון מיון">↑</button>
    </div>
    <div id="list-container"></div>
    <div class="empty-state hidden" id="empty-state">
      <div class="big">🧊</div>
      <div>עדיין אין פריטים במלאי</div>
      <button class="btn primary" onclick="document.getElementById('file-input').click()">ייבוא מקובץ אקסל</button>
    </div>
  </main>

  <main id="view-insights" class="hidden">
    <div id="insights-content"></div>
  </main>

  <main id="view-locations" class="hidden">
    <div id="locations-content"></div>
  </main>

  <button class="fab" id="add-btn">+</button>

  <nav class="tabbar">
    <button class="tab-btn active" data-view="inventory"><span class="ic">🧊</span>מלאי</button>
    <button class="tab-btn" data-view="insights"><span class="ic">📊</span>תובנות</button>
    <button class="tab-btn" data-view="locations"><span class="ic">🗄️</span>מיקומים</button>
  </nav>
</div>

<!-- Add/Edit modal -->
<div class="modal hidden" id="modal-form">
  <div class="sheet">
    <h2 id="form-title">פריט חדש</h2>
    <div class="field"><label>שם הפריט</label><input id="f-name" list="dl-names"></div>
    <div class="row2">
      <div class="field"><label>קטגוריה</label><input id="f-category" list="dl-categories"></div>
      <div class="field"><label>מקרר</label><input id="f-location" list="dl-locations"></div>
    </div>
    <div class="row2">
      <div class="field"><label>מדף</label><input id="f-shelf"></div>
      <div class="field"><label>אריזות</label><input id="f-packages" inputmode="numeric" value="1"></div>
    </div>
    <div class="row2">
      <div class="field"><label>כמות (לא חובה)</label><input id="f-quantity" inputmode="decimal"></div>
      <div class="field"><label>יחידת מידה</label><input id="f-unit" list="dl-units"></div>
    </div>
    <div class="row2">
      <div class="field"><label>תאריך כניסה</label><input id="f-entryDate" type="date"></div>
      <div class="field"><label>תאריך תפוגה</label><input id="f-expiryDate" type="date"></div>
    </div>
    <div class="field"><label>הערות</label><input id="f-notes"></div>
    <datalist id="dl-names"></datalist>
    <datalist id="dl-categories"></datalist>
    <datalist id="dl-locations"></datalist>
    <datalist id="dl-units"><option value="גרם"><option value="ק&quot;ג"><option value="יחידות"><option value="מנות"></datalist>
    <div class="modal-actions">
      <button class="btn secondary" id="form-cancel">ביטול</button>
      <button class="btn primary" id="form-save">שמירה</button>
    </div>
  </div>
</div>

<!-- Menu modal -->
<div class="modal hidden" id="modal-menu">
  <div class="sheet">
    <h2>אפשרויות</h2>
    <div class="menu-list">
      <button id="menu-import">ייבוא מאקסל <span>📥</span></button>
      <button id="menu-export">ייצוא לאקסל <span>📤</span></button>
      <button id="menu-reset">איפוס כל הנתונים <span>🗑️</span></button>
      <button id="menu-close">סגירה</button>
    </div>
  </div>
</div>

<!-- Import mapping modal -->
<div class="modal hidden" id="modal-import">
  <div class="sheet">
    <h2>התאמת עמודות לייבוא</h2>
    <small class="hint">בדוק/עדכן איזו עמודה בקובץ מתאימה לכל שדה</small>
    <div id="import-map-list" style="margin-top:12px;"></div>
    <div class="import-mode">
      <label><input type="radio" name="imode" value="merge"> הוספה למלאי הקיים</label>
      <label><input type="radio" name="imode" value="replace" checked> החלפת כל המלאי</label>
    </div>
    <div class="modal-actions">
      <button class="btn secondary" id="import-cancel">ביטול</button>
      <button class="btn primary" id="import-confirm">ייבוא</button>
    </div>
  </div>
</div>

<input type="file" id="file-input" accept=".xlsx,.xls" class="hidden">
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style/dist/xlsx.bundle.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
<script>
(function(){
  "use strict";

  // Same Firebase project as the wine cellar app (Dan's choice — no new setup
  // needed). Freezer data lives under its own top-level path ("freezer"),
  // completely separate from the "wines" path the wine app uses.
  var firebaseConfig = {
    apiKey: "AIzaSyDkNevHeLWSt9gVpN2f-lIbWwDcLdQuh_k",
    authDomain: "wine-cellar-23e4d.firebaseapp.com",
    databaseURL: "https://wine-cellar-23e4d-default-rtdb.firebaseio.com",
    projectId: "wine-cellar-23e4d",
    storageBucket: "wine-cellar-23e4d.firebasestorage.app",
    messagingSenderId: "1002676847037",
    appId: "1:1002676847037:web:3a58b84378b0e58a8552d4"
  };

  // Defensive: if the Firebase SDK failed to load (offline, ad-blocker, CDN
  // hiccup), fall back to local-only mode instead of crashing the whole app.
  var firebaseOk = typeof firebase !== "undefined";
  var itemsRef = null, authReady = Promise.resolve(null);
  if (firebaseOk){
    try{
      firebase.initializeApp(firebaseConfig);
      itemsRef = firebase.database().ref("freezer");
      // sign in anonymously so the database SDK carries a valid auth context.
      // the SDK (unlike raw fetch/EventSource) manages its own persistent connection,
      // auth-token refresh, and reconnection after network loss / backgrounding.
      authReady = new Promise(function(resolve){
        firebase.auth().onAuthStateChanged(function(user){
          if (user) resolve(user);
        });
        firebase.auth().signInAnonymously().catch(function(err){
          console.error("Firebase auth failed:", err);
        });
      });
    }catch(err){
      console.error("Firebase init failed:", err);
      firebaseOk = false;
    }
  } else {
    console.warn("Firebase SDK not available — running in local-only mode.");
  }

  var FIELDS = [
    {key:"category", label:"קטגוריה", aliases:["קטגוריה"]},
    {key:"name", label:"שם", aliases:["שם","שם הפריט"]},
    {key:"packages", label:"אריזות", aliases:["אריזות"]},
    {key:"quantity", label:"כמות", aliases:["כמות"]},
    {key:"unit", label:"מידה", aliases:["מידה","יחידת מידה"]},
    {key:"entryDate", label:"כניסה", aliases:["כניסה","תאריך כניסה"]},
    {key:"expiryDate", label:"תפוגה", aliases:["תפוגה","תאריך תפוגה"]},
    {key:"location", label:"מקרר", aliases:["מקרר"]},
    {key:"shelf", label:"מדף", aliases:["מדף"]},
    {key:"notes", label:"הערות", aliases:["הערות"]}
  ];

  var STORAGE_KEY = "freezerInventoryData_v1";
  var items = [];
  var currentView = "inventory";
  var currentCategoryFilter = "הכל";
  var currentLocationFilter = "הכל";
  var editingId = null;
  var pendingImportRows = null;
  var pendingImportHeaders = null;
  var currentSort = {field:"category", dir:"asc"};
  var NUMERIC_SORT_FIELDS = {packages:1, quantity:1};
  var WARNING_DAYS = 7, SERIOUS_DAYS = 3;

  function cmpField(av, bv, isNumeric){
    if (isNumeric) return num(av) - num(bv);
    return String(av||"").localeCompare(String(bv||""), "he");
  }

  function sortItemsList(list){
    var f = currentSort.field;
    var dir = currentSort.dir === "asc" ? 1 : -1;
    list.sort(function(a,b){
      var cmp;
      if (f === "category"){
        cmp = cmpField(a.category, b.category, false);
        if (cmp === 0) cmp = cmpField(a.location, b.location, false);
        if (cmp === 0) cmp = cmpField(a.name, b.name, false);
      } else {
        cmp = cmpField(a[f], b[f], !!NUMERIC_SORT_FIELDS[f]);
      }
      return cmp * dir;
    });
    return list;
  }

  function uid(){
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return "id-" + Date.now() + "-" + Math.random().toString(16).slice(2);
  }

  function loadItems(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    }catch(e){ return []; }
  }
  function saveItems(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
  }

  // ---- cloud sync (Firebase Realtime Database SDK) ----
  // Using the official SDK instead of raw REST/EventSource: it keeps a persistent
  // WebSocket connection, refreshes the auth token by itself, and automatically
  // reconnects after the device sleeps, loses network, or the tab is backgrounded.
  function cloudPutItem(item){
    if (!firebaseOk) return;
    authReady.then(function(){
      itemsRef.child(item.id).set(item).catch(function(err){
        console.error("Firebase write failed:", err);
        toast("סנכרון נכשל: " + (err && err.message ? err.message : err));
      });
    });
  }
  function cloudDeleteItem(id){
    if (!firebaseOk) return;
    authReady.then(function(){
      itemsRef.child(id).remove().catch(function(err){
        console.error("Firebase delete failed:", err);
        toast("מחיקה בענן נכשלה: " + (err && err.message ? err.message : err));
      });
    });
  }
  function cloudReplaceAll(list){
    if (!firebaseOk) return;
    var obj = {};
    list.forEach(function(it){ obj[it.id] = it; });
    authReady.then(function(){
      itemsRef.set(obj).catch(function(err){
        console.error("Firebase replace-all failed:", err);
        toast("סנכרון נכשל: " + (err && err.message ? err.message : err));
      });
    });
  }
  function startCloudSync(){
    if (!firebaseOk) return;
    authReady.then(function(){
      itemsRef.on("value", function(snapshot){
        var data = snapshot.val();
        items = data ? Object.keys(data).map(function(k){ return data[k]; }) : [];
        saveItems();
        renderAll();
      }, function(err){
        console.error("Firebase sync error:", err);
      });
    });
  }

  function toast(msg){
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(function(){ t.classList.remove("show"); }, 2200);
  }

  // ---- category badge color (hash-assigned, stable per category name) ----
  var categoryColorCache = {};
  function categoryBadgeClass(category){
    var key = (category || "אחר").toString();
    if (categoryColorCache[key]) return categoryColorCache[key];
    var hash = 0;
    for (var i = 0; i < key.length; i++){ hash = (hash * 31 + key.charCodeAt(i)) >>> 0; }
    var cls = "c" + (hash % 8);
    categoryColorCache[key] = cls;
    return cls;
  }

  function num(v){
    var n = parseFloat(String(v).replace(/[^\d.\-]/g,""));
    return isNaN(n) ? 0 : n;
  }

  function daysUntil(iso){
    if (!iso) return null;
    var parts = String(iso).split("-").map(Number);
    if (!parts[0]) return null;
    var target = Date.UTC(parts[0], parts[1]-1, parts[2]);
    var now = new Date();
    var todayUTC = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
    return Math.round((target - todayUTC) / 86400000);
  }
  function fmtDate(iso){
    if (!iso) return "";
    var p = String(iso).split("-");
    if (p.length !== 3) return iso;
    return p[2] + "." + p[1] + "." + p[0];
  }
  function expiryStatus(iso){
    if (!iso) return {level:"none", label:""};
    var d = daysUntil(iso);
    if (d === null) return {level:"none", label:""};
    if (d < 0) return {level:"critical", label:"פג תוקף"};
    if (d === 0) return {level:"critical", label:"פג היום"};
    if (d <= SERIOUS_DAYS) return {level:"serious", label:"עוד "+d+" ימים"};
    if (d <= WARNING_DAYS) return {level:"warning", label:"עוד "+d+" ימים"};
    return {level:"good", label:""};
  }

  function matches(it, q){
    if (!q) return true;
    q = q.trim().toLowerCase();
    var hay = [it.name,it.category,it.location,it.shelf,it.unit,it.notes]
      .map(function(x){return (x||"").toString().toLowerCase();}).join(" | ");
    return hay.indexOf(q) > -1;
  }

  function getFilteredItems(){
    var q = document.getElementById("search").value;
    return items.filter(function(it){
      var catOk = currentCategoryFilter === "הכל" || (it.category||"ללא קטגוריה") === currentCategoryFilter;
      var locOk = currentLocationFilter === "הכל" || (it.location||"לא משויך") === currentLocationFilter;
      return catOk && locOk && matches(it, q);
    });
  }

  function renderChipRow(containerId, values, currentVal, onPick){
    var el = document.getElementById(containerId);
    el.innerHTML = "";
    values.forEach(function(v){
      var b = document.createElement("button");
      b.className = "chip" + (v === currentVal ? " active" : "");
      b.textContent = v;

  function renderChips(){

    var groupList = getFilteredItems();

      '<div class="summary-card"><div class="num">'+distinctLocations+'</div><div class="lbl">מקררים</div></div>';

    container.innerHTML = list.map(function(it){

        ? '<span class="status-ribbon '+st.level+'">'+esc(st.label)+'</span>' : "";
      return '<div class="card">' +
        ribbon +

        '</div>' +

          (it.location? '<span>מקרר: <b>'+esc(it.location)+'</b></span>':'') +

          (it.entryDate? '<span>כניסה: <b>'+esc(fmtDate(it.entryDate))+'</b></span>':'') +
          (it.expiryDate? '<span>תפוגה: <b>'+esc(fmtDate(it.expiryDate))+'</b></span>':'') +
          (it.notes? '<span>הערות: <b>'+esc(it.notes)+'</b></span>':'') +
        '</div>' +
        '<div class="card-actions">' +
          '<button class="qty-btn" onclick="freezerApp.changePackages(\''+it.id+'\',-1)">−</button>' +

          '<button onclick="freezerApp.deleteItem(\''+it.id+'\')">מחיקה</button>' +

      '</div>';
    }).join("");

  function esc(s){
    return String(s==null?"":s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
    });
  }

  function renderInsights(){
    var el = document.getElementById("insights-content");
    if (items.length === 0){
      el.innerHTML = '<div class="empty-state"><div class="big">📊</div><div>אין נתונים להצגה עדיין</div></div>';
      return;
    }
    var totalPackages = items.reduce(function(s,it){return s+num(it.packages);},0);
    var byCategory = {};
    items.forEach(function(it){
      var c = it.category || "ללא קטגוריה";
      byCategory[c] = (byCategory[c]||0) + num(it.packages);
    });
    var byLocation = {};
    items.forEach(function(it){
      var l = it.location || "לא משויך";
      byLocation[l] = (byLocation[l]||0) + num(it.packages);
    });
    var byName = {};
    items.forEach(function(it){
      var n = it.name || "ללא שם";
      byName[n] = (byName[n]||0) + num(it.packages);
    });

    var expiringSoon = 0, expired = 0;
    items.forEach(function(it){
      var d = daysUntil(it.expiryDate);
      if (d !== null){ if (d < 0) expired++; else if (d <= WARNING_DAYS) expiringSoon++; }
    });

    function barsHtml(obj, max){
      var entries = Object.keys(obj).map(function(k){return [k,obj[k]];}).sort(function(a,b){return b[1]-a[1];});
      if (max) entries = entries.slice(0, max);
      var top = entries.length ? entries[0][1] : 1;
      return entries.map(function(e){
        var pct = top ? Math.round((e[1]/top)*100) : 0;
        return '<div class="bar-row"><div class="lbl">'+esc(e[0])+'</div>' +
          '<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%"></div></div>' +
          '<div class="val">'+e[1]+'</div></div>';
      }).join("");
    }

    el.innerHTML =
      '<div class="summary-bar">' +
        '<div class="summary-card"><div class="num">'+totalPackages+'</div><div class="lbl">סה״כ אריזות</div></div>' +
        '<div class="summary-card warn"><div class="num">'+expiringSoon+'</div><div class="lbl">מתקרבים לתפוגה</div></div>' +
        '<div class="summary-card crit"><div class="num">'+expired+'</div><div class="lbl">פג תוקפם</div></div>' +
      '</div>' +
      '<div class="section-title">לפי קטגוריה</div>' + barsHtml(byCategory) +
      '<div class="section-title">לפי מקרר</div>' + barsHtml(byLocation, 8) +
      '<div class="section-title">פריטים מובילים (לפי אריזות)</div>' + barsHtml(byName, 8);

  // ---- form modal ----
  var formFieldIds = ["name","category","location","shelf","packages","quantity","unit","entryDate","expiryDate","notes"];

    document.getElementById("form-title").textContent = item ? "עריכת פריט" : "פריט חדש";

  function saveForm(){
    var data = {};

  function changePackages(id, delta){

    if (!it) return;

    it.packages = q;

  // ---- import ----
  function guessColumn(headers, aliases){
    for (var i=0;i<headers.length;i++){
      var h = (headers[i]||"").toString().trim();
      for (var j=0;j<aliases.length;j++){
        if (h === aliases[j]) return headers[i];
      }
    }
    for (var i2=0;i2<headers.length;i2++){
      var h2 = (headers[i2]||"").toString().trim();
      for (var j2=0;j2<aliases.length;j2++){
        if (h2.indexOf(aliases[j2]) > -1) return headers[i2];
      }
    }
    return "";
  }

  function normalizeDateCell(v){
    if (v == null || v === "") return "";
    if (v instanceof Date && !isNaN(v)) {
      return v.getFullYear() + "-" + String(v.getMonth()+1).padStart(2,"0") + "-" + String(v.getDate()).padStart(2,"0");
    }
    var s = String(v).trim();
    if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
    var m = s.match(/^(\d{1,2})[./](\d{1,2})[./](\d{2,4})$/);
    if (m){
      var yyyy = m[3].length === 2 ? "20"+m[3] : m[3];
      return yyyy + "-" + m[2].padStart(2,"0") + "-" + m[1].padStart(2,"0");
    }
    return s;
  }

  function handleFile(file){
    if (typeof XLSX === "undefined"){
      toast("טעינת ספריית האקסל נכשלה — בדקו חיבור לאינטרנט ונסו שוב");
      return;
    }
    var reader = new FileReader();
    reader.onload = function(e){
      try{
        var data = new Uint8Array(e.target.result);
        var wb = XLSX.read(data, {type:"array", cellDates:true});
        var sheetName = wb.SheetNames.indexOf("מלאי") > -1 ? "מלאי" : wb.SheetNames[0];
        var sheet = wb.Sheets[sheetName];
        var rows = XLSX.utils.sheet_to_json(sheet, {defval:""});
        if (!rows.length){ toast("הקובץ ריק"); return; }
        pendingImportRows = rows;
        var headerSet = {};
        var headerList = [];
        rows.forEach(function(row){
          Object.keys(row).forEach(function(k){
            if (!headerSet[k]){ headerSet[k] = true; headerList.push(k); }
          });
        });
        pendingImportHeaders = headerList;
        openImportModal();
      }catch(err){
        console.error(err);
        toast("שגיאה בקריאת הקובץ");
      }
    };
    reader.readAsArrayBuffer(file);
  }

  function openImportModal(){
    var listEl = document.getElementById("import-map-list");
    listEl.innerHTML = FIELDS.map(function(f){
      var guess = guessColumn(pendingImportHeaders, f.aliases);
      var options = ['<option value="">— לא לייבא —</option>'].concat(
        pendingImportHeaders.map(function(h){
          return '<option value="'+esc(h)+'"'+(h===guess?" selected":"")+'>'+esc(h)+'</option>';
        })
      ).join("");
      return '<div class="import-map-row"><div class="lbl">'+f.label+'</div>' +
        '<select data-field="'+f.key+'">'+options+'</select></div>';
    }).join("");
    document.getElementById("modal-import").classList.remove("hidden");
  }
  function closeImportModal(){
    document.getElementById("modal-import").classList.add("hidden");
    document.getElementById("file-input").value = "";
  }

  function isSummaryRow(it){
    var keywords = ["סה\"כ","סה״כ","סהכ","סך הכל","total","grand total"];
    var text = [it.name,it.category,it.location,it.shelf].join(" ").toLowerCase();
    for (var i=0;i<keywords.length;i++){
      if (text.indexOf(keywords[i].toLowerCase()) > -1) return true;
    }
    var hasIdentity = it.name || it.category || it.location;
    if (!hasIdentity && (it.packages || it.quantity)) return true;
    return false;
  }

  function confirmImport(){
    var mapping = {};
    document.querySelectorAll("#import-map-list select").forEach(function(sel){
      mapping[sel.dataset.field] = sel.value;
    });
    var mode = document.querySelector('input[name="imode"]:checked').value;
    var scanned = pendingImportRows.length;
    var allMapped = pendingImportRows.map(function(row){
      var it = {id: uid()};
      FIELDS.forEach(function(f){
        var col = mapping[f.key];
        if (!col){ it[f.key] = ""; return; }
        var raw = row[col];
        if (f.key === "entryDate" || f.key === "expiryDate"){
          it[f.key] = normalizeDateCell(raw);
        } else {
          it[f.key] = raw != null ? String(raw).trim() : "";
        }
      });
      if (!it.packages) it.packages = "0";
      return it;
    });
    var imported = allMapped.filter(function(it){
      var hasAny = FIELDS.some(function(f){ return it[f.key]; });
      return hasAny && !isSummaryRow(it);
    });
    var skipped = scanned - imported.length;

    if (mode === "replace"){
      items = imported;
    } else {
      items = items.concat(imported);
    }
    saveItems();
    cloudReplaceAll(items);
    closeImportModal();
    renderAll();
    toast("נסרקו "+scanned+" שורות · יובאו "+imported.length+(skipped ? " · דולגו "+skipped+" ריקות" : ""));
  }

  // ---- export ----
  var EXPORT_COLUMN_ORDER = ["category","name","packages","quantity","unit","entryDate","expiryDate","location","shelf","notes"];

  function exportToExcel(){
    if (typeof XLSX === "undefined"){
      toast("טעינת ספריית האקסל נכשלה — בדקו חיבור לאינטרנט ונסו שוב");
      return;
    }
    if (!items.length){ toast("אין נתונים לייצוא"); return; }

    var exportFields = EXPORT_COLUMN_ORDER.map(function(key){
      return FIELDS.filter(function(f){ return f.key === key; })[0];
    });

    var sorted = items.slice().sort(function(a,b){
      var byCat = String(a.category||"").localeCompare(String(b.category||""), "he");
      if (byCat) return byCat;
      var byLoc = String(a.location||"").localeCompare(String(b.location||""), "he");
      if (byLoc) return byLoc;
      return String(a.name||"").localeCompare(String(b.name||""), "he");
    });

    var rows = sorted.map(function(it){
      var r = {};
      exportFields.forEach(function(f){
        r[f.label] = (f.key === "packages" || f.key === "quantity") ? (it[f.key] ? num(it[f.key]) : "") : (it[f.key] || "");
      });
      return r;
    });

    var ws = XLSX.utils.json_to_sheet(rows);

    // summary row: total packages, at the bottom of the packages column
    var totalPackages = sorted.reduce(function(sum,it){ return sum + num(it.packages); }, 0);
    var summaryExcelRow = rows.length + 2; // header (1) + data rows + 1
    var summaryRow = exportFields.map(function(f){
      if (f.key === "category") return "סה\"כ";
      if (f.key === "packages") return totalPackages;
      return "";
    });
    XLSX.utils.sheet_add_aoa(ws, [summaryRow], {origin: "A" + summaryExcelRow});

    // center-align every cell (header, data, summary), bold header + summary,
    // Tahoma 11 font, and thin borders on all sides of every cell
    var thinBorder = { style: "thin", color: { rgb: "000000" } };
    var range = XLSX.utils.decode_range(ws["!ref"]);
    for (var R = range.s.r; R <= range.e.r; R++){
      for (var C = range.s.c; C <= range.e.c; C++){
        var addr = XLSX.utils.encode_cell({r:R, c:C});
        var cell = ws[addr];
        if (!cell) continue;
        var isHeaderOrSummary = (R === range.s.r) || (R === range.e.r);
        cell.s = {
          alignment: { horizontal: "center", vertical: "center" },
          font: { name: "Tahoma", sz: 11, bold: isHeaderOrSummary },
          border: { top: thinBorder, bottom: thinBorder, left: thinBorder, right: thinBorder }
        };
      }
    }
    ws["!cols"] = exportFields.map(function(){ return {wch: 14}; });

    var now = new Date();
    var dd = String(now.getDate()).padStart(2,"0");
    var mm = String(now.getMonth()+1).padStart(2,"0");
    var yyyy = now.getFullYear();
    var printDate = dd + "." + mm + "." + yyyy;

    // printed page footer, date in the right-hand section
    ws["!headerFooter"] = {
      oddFooter: "&R" + printDate,
      evenFooter: "&R" + printDate,
      firstFooter: "&R" + printDate
    };

    // print setup: landscape, A4, header row repeated on every page
    ws["!pageSetup"] = { orientation: "landscape", paperSize: 9, fitToWidth: 1, fitToHeight: 0 };
    ws["!margins"] = { left:0.4, right:0.4, top:0.6, bottom:0.6, header:0.3, footer:0.3 };

    var wb = XLSX.utils.book_new();
    wb.Workbook = {
      Views: [{ RTL: true }], // sheet displayed right-to-left
      Names: [{ Sheet: 0, Name: "_xlnm.Print_Titles", Ref: "מלאי!$1:$1" }] // repeat header row on every printed page
    };
    XLSX.utils.book_append_sheet(wb, ws, "מלאי");
    XLSX.writeFile(wb, "מלאי קפואים - " + printDate + ".xlsx");
  }

  function resetAll(){
    if (!confirm("פעולה זו תמחק את כל המלאי השמור באפליקציה. להמשיך?")) return;
    items = [];
    saveItems();
    cloudReplaceAll(items);
    renderAll();
    document.getElementById("modal-menu").classList.add("hidden");
    toast("המלאי אופס");
  }

  // ---- wire up events ----
  document.addEventListener("DOMContentLoaded", function(){
    items = loadItems();
    renderAll();
    startCloudSync();

    document.getElementById("search").addEventListener("input", function(){
      renderSummary();
      renderList();
    });

    document.getElementById("sort-field").value = currentSort.field;
    document.getElementById("sort-field").addEventListener("change", function(e){
      currentSort.field = e.target.value;
      renderList();
    });
    document.getElementById("sort-dir").addEventListener("click", function(){
      currentSort.dir = currentSort.dir === "asc" ? "desc" : "asc";
      document.getElementById("sort-dir").textContent = currentSort.dir === "asc" ? "↑" : "↓";
      renderList();
    });

    document.querySelectorAll(".tab-btn").forEach(function(b){
      b.addEventListener("click", function(){ showView(b.dataset.view); });
    });

    document.getElementById("add-btn").addEventListener("click", function(){ openForm(null); });
    document.getElementById("form-cancel").addEventListener("click", closeForm);
    document.getElementById("form-save").addEventListener("click", saveForm);

    document.getElementById("menu-btn").addEventListener("click", function(){
      document.getElementById("modal-menu").classList.remove("hidden");
    });
    document.getElementById("menu-close").addEventListener("click", function(){
      document.getElementById("modal-menu").classList.add("hidden");
    });
    document.getElementById("menu-import").addEventListener("click", function(){
      document.getElementById("modal-menu").classList.add("hidden");
      document.getElementById("file-input").click();
    });
    document.getElementById("menu-export").addEventListener("click", function(){
      document.getElementById("modal-menu").classList.add("hidden");
      exportToExcel();
    });
    document.getElementById("menu-reset").addEventListener("click", resetAll);

    document.getElementById("file-input").addEventListener("change", function(e){
      if (e.target.files && e.target.files[0]) handleFile(e.target.files[0]);
    });
    document.getElementById("import-cancel").addEventListener("click", closeImportModal);
    document.getElementById("import-confirm").addEventListener("click", confirmImport);
  });

  window.freezerApp = {
    editItem: editItem,
    deleteItem: deleteItem,
    changePackages: changePackages
  };
})();
</script>
</body>
</html>
